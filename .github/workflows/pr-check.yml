name: PR Check

# Runs on every pull request targeting develop or main.
# Acts as a gate — the PR cannot be merged if this workflow fails.
on:
  pull_request:
    branches: [develop, main]

# Cancel any in-progress run for the same branch if a new push arrives.
# Prevents wasted Actions minutes on outdated commits.
concurrency:
  group: pr-check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compile & Test (Android)
    runs-on: ubuntu-latest

    steps:
      # Check out the full repository at the PR's head commit.
      - name: Checkout
        uses: actions/checkout@v4

      # Use JDK 17 (Temurin distribution) — minimum required by AGP 8.x.
      # Temurin is the open-source Eclipse build of OpenJDK, recommended for CI.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle's official action. Automatically caches the Gradle home directory
      # and build outputs between runs to speed up subsequent builds.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Compile the Android debug target across all source sets (commonMain + androidMain).
      # Catches type errors and misconfigured dependencies before running tests.
      - name: Compile
        run: ./gradlew :spacetradersiosdk:compileAndroidHostTestSources

      # Run all unit tests in the debug variant.
      # Tests live in commonTest and are compiled to run on the JVM here.
      - name: Unit tests
        run: ./gradlew :spacetradersiosdk:allTests
